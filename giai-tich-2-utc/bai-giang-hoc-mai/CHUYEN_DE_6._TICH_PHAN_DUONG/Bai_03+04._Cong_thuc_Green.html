<h1>CHUYÊN ĐỀ: CÔNG THỨC GREEN</h1>

<h2>a) Công thức</h2>

<p>Gọi \(D\) là miền giới hạn bởi đường cong kín \(L\). Giả sử các hàm:</p>
<p>\[P(x,y),\ Q(x,y),\ P'_y(x,y),\ Q'_x(x,y)\]</p>
<p>là các hàm liên tục trên \(D\).</p>
<p>Khi đó:</p>
<p>\[\oint_{L^+} Pdx + Qdy=\iint_{D} \left( Q'_x - P'_y \right) dxdy\]</p>
